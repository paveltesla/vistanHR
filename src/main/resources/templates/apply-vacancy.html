<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Подать заявку на работу - Вистан</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-building"></i> Вистан - HR Система
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="fas fa-home"></i> Главная
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- Сообщения об успехе/ошибке -->
    <div th:if="${success_mess}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success_mess}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error_mess}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error_mess}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="fas fa-paper-plane"></i> Подать заявку на работу</h4>
                </div>
                <div class="card-body">
                    <!-- ВАЖНО: action теперь указывает на /applications/apply -->
                    <form th:action="@{/applications/apply}" th:object="${applications}" method="post">
                        <!-- Скрытое поле с ID вакансии обязательно -->
                        <input type="hidden" name="vacancyId" th:value="${vacancy.id}">

                        <div class="mb-3">
                            <label class="form-label">ФИО *</label>
                            <input type="text" th:field="*{fullName}" class="form-control" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Телефон *</label>
                                <input type="tel" th:field="*{phone}" class="form-control" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Опыт работы (лет)</label>
                                <input type="number" th:field="*{experience}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ожидаемая зарплата (BYN)</label>
                                <input type="number" th:field="*{expectedSalary}" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Навыки</label>
                            <textarea th:field="*{skills}" class="form-control" rows="3"
                                      placeholder="Перечислите ваши ключевые навыки..."></textarea>
                        </div>

                        <!-- Было поле Сопроводительное письмо, теперь уровень образования -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Уровень образования *</label>
                            <select th:field="*{educationLevel}" class="form-select" required>
                                <option value="NOT_SPECIFIED">Выберите уровень образования...</option>
                                <option value="PTO">Профессионально-техническое (ПТО)</option>
                                <option value="SSO">Среднее специальное (ССО)</option>
                                <option value="HE">Высшее образование (ВО)</option>
                                <option value="POSTGRADUATE">Магистратура / Аспирантура</option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('educationLevel')}" th:errors="*{educationLevel}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Резюме (текст)</label>
                            <textarea th:field="*{resume}" class="form-control" rows="6"
                                      placeholder="Ваше резюме: образование, опыт работы, достижения..."></textarea>
                        </div>

                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> После отправки заявки, наш HR-менеджер свяжется с вами в ближайшее время.
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-paper-plane"></i> Отправить заявку
                            </button>
                            <a href="/" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times"></i> Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: script}"></script>
</body>
</html>
