<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админ - Вистан</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .card-hover:hover { transform: translateY(-5px); transition: 0.3s; }
        body { background: #f8f9fa; }
        .nav-link.active { background: rgba(255,255,255,0.2); border-radius: 5px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<main class="container mt-4">
    <div class="container mt-4">
        <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
        <div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>

        <h2><i class="fas fa-tachometer-alt"></i> Панель управления</h2>
        <hr>

        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="card text-white bg-info card-hover">
                    <div class="card-body text-center p-4">
                        <i class="fas fa-briefcase fa-3x mb-2"></i>
                        <h2 th:text="${openVacancies}"></h2>
                        <p>Открыто: <span th:text="${openVacancies}"></span> | Всего: <span th:text="${totalVacancies}"></span></p>
                        <a href="/admin/vacancies" class="text-white">управление</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card text-white bg-warning card-hover">
                    <div class="card-body text-center p-4">
                        <i class="fas fa-file-alt fa-3x mb-2"></i>
                        <h2 th:text="${pendingApplications}"></h2>
                        <p>Новых: <span th:text="${pendingApplications}"></span> | Всего: <span th:text="${totalApplications}"></span></p>
                        <a th:href="@{/admin/applications}" class="text-white">Просмотр <i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white"><h5><i class="fas fa-bolt"></i> Быстрые действия</h5></div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <a th:href="@{/admin/vacancies/add}" class="btn btn-outline-primary btn-lg w-100"><i class="fas fa-plus-circle"></i> Создать вакансию</a>
                    </div>
                    <div class="col-md-6 mb-2">
                        <a th:href="@{/admin/applications}" class="btn btn-outline-warning btn-lg w-100"><i class="fas fa-file-alt"></i> Все отклики</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: script}"></script>
</body>
</html>
