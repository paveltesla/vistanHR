<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Подать заявку — Вистан</title>
    <th:block th:replace="~{fragments :: header-css}"></th:block>
</head>
<body>

<nav th:replace="~{fragments :: navbar-admin}"></nav>

<main class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-paper-plane"></i>
                        Отклик на вакансию: <span th:text="${vacancyes != null ? vacancy.title : 'Инициативная заявка'}"></span>
                    </h4>
                </div>
                <div class="card-body">

                    <form th:action="@{/applications/apply}" th:object="${applications}" method="post">

                        <input type="hidden" name="vacancyId" th:value="${vacancy != null ? vacancy.id : ''}">

                        <div class="mb-3">
                            <label class="form-label">ФИО *</label>
                            <input type="text" th:field="*{fullName}" class="form-control" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <input type="hidden" th:field="*{applicationType}">
                        <input type="hidden" th:field="*{position}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Телефон *</label>
                                <input type="tel" th:field="*{phone}" class="form-control" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Опыт работы (лет)</label>
                                <input type="number" th:field="*{experience}" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ожидаемая зарплата (BYN)</label>
                                <input type="number" th:field="*{expectedSalary}" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Навыки</label>
                            <textarea th:field="*{skills}" class="form-control" rows="3" placeholder="Перечислите ваши ключевые навыки..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Сопроводительное письмо</label>
                            <textarea th:field="*{coverLetter}" class="form-control" rows="4" placeholder="Расскажите о себе..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Резюме (текст)</label>
                            <textarea th:field="*{resume}" class="form-control" rows="6" placeholder="Ваше резюме..."></textarea>
                        </div>

                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> После отправки заявки, наш HR-менеджер свяжется с вами в ближайшее время.
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-paper-plane"></i> Отправить заявку
                            </button>
                            <a href="/" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times"></i> Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: script}"></script>
</body>
</html>
