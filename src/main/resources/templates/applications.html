<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Отклики соискателей — Вистан</title>
    <!-- Подключаем наши единые стили -->
    <th:block th:replace="~{fragments :: header-css}"></th:block>
</head>
<body>

<!-- Подключаем нашу общую правильную шапку -->
<nav th:replace="~{fragments :: navbar-admin}"></nav>

<main class="container mt-4">
    <!-- Уведомления об операциях (например, после удаления отклика) -->
    <div th:if="${success_mess}" class="alert alert-success shadow-sm"><span th:text="${success_mess}"></span></div>
    <div th:if="${error_mess}" class="alert alert-danger shadow-sm"><span th:text="${error_mess}"></span></div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="fas fa-file-alt"></i>
                <!-- Динамический заголовок: все отклики или с фильтром по вакансии -->
                <span th:if="${filterVacancy != null}">Отклики на вакансию: <span th:text="${filterVacancy.title}"></span></span>
                <span th:unless="${filterVacancy != null}">Все входящие отклики</span>
            </h4>
            <!-- ИСПРАВЛЕНО: Ссылка сброса фильтра ведет на правильный админский путь -->
            <a th:if="${filterVacancy != null}" th:href="@{/admin/applications}" class="btn btn-light btn-sm">
                <i class="fas fa-list"></i> Показать все
            </a>
        </div>
        <div class="card-body">

            <!-- Проверка: если отклики есть — выводим таблицу -->
            <div class="table-responsive" th:if="${not #lists.isEmpty(applications)}">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>ФИО кандидата</th>
                        <th>Вакансия</th>
                        <th>Email</th>
                        <th>Телефон</th>
                        <th>Опыт работы</th>
                        <th>Статус</th>
                        <th>Дата подачи</th>
                        <th class="text-center">Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${applications}">
                        <td th:text="${a.id}"></td>
                        <td><strong th:text="${a.fullName}"></strong></td>
                        <td>
                            <!-- Защита от NullPointerException, если вакансию вдруг удалили -->
                            <span th:if="${a.vacancy != null}" th:text="${a.vacancy.title}" class="text-secondary"></span>
                            <span th:unless="${a.vacancy != null}" class="text-muted">Вакансия удалена</span>
                        </td>
                        <td th:text="${a.email}"></td>
                        <td th:text="${a.phone}"></td>
                        <td>
                            <!-- ИСПРАВЛЕНО: Красивый вывод опыта работы без "null лет" -->
                            <span th:if="${a.experience != null && a.experience > 0}" th:text="${a.experience + ' лет'}"></span>
                            <span th:unless="${a.experience != null && a.experience > 0}" class="text-muted">Без опыта</span>
                        </td>
                        <td>
                            <!-- Цветные бейджи статусов отклика -->
                            <span th:if="${a.applicationStatus == 'PENDING'}" class="badge bg-warning text-dark">Новый</span>
                            <span th:if="${a.applicationStatus == 'REVIEWED'}" class="badge bg-info text-dark">Просмотрен</span>
                            <span th:if="${a.applicationStatus == 'INTERVIEW'}" class="badge bg-primary">Собеседование</span>
                            <span th:if="${a.applicationStatus == 'ACCEPTED'}" class="badge bg-success">Принят</span>
                            <span th:if="${a.applicationStatus == 'REJECTED'}" class="badge bg-danger">Отклонен</span>
                        </td>
                        <td th:text="${#temporals.format(a.applicationDate, 'dd.MM.yyyy')}"></td>
                        <td>
                            <!-- ИСПРАВЛЕНО: Пути кнопок переписаны под AdminApplicationController -->
                            <div class="d-flex justify-content-center">
                                <div class="btn-group btn-group-sm">
                                    <!-- Посмотреть резюме подробно -->
                                    <a th:href="@{/admin/applications/review/{id}(id=${a.id})}" class="btn btn-primary" title="Просмотреть отклик">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                    <!-- Удалить отклик -->
                                    <a th:href="@{/admin/applications/delete/{id}(id=${a.id})}" class="btn btn-danger"
                                       onclick="return confirm('Вы уверены, что хотите окончательно удалить этот отклик соискателя?')" title="Удалить">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Заглушка, если откликов нет (например, фильтр пустой) -->
            <div th:unless="${not #lists.isEmpty(applications)}" class="text-center text-muted py-5">
                <i class="fas fa-folder-open fa-3x mb-3"></i>
                <h5>Ни одного отклика пока не найдено</h5>
            </div>
        </div>
    </div>
</main>

<!-- Подключаем наш общий прижатый подвал -->
<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: script}"></script>
</body>
</html>
