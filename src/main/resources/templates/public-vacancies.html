<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вакансии - Вистан</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container mt-4">
    <div th:if="${success_mess}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success_mess}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2><i class="fas fa-briefcase"></i> Открытые вакансии <span class="badge bg-primary" th:text="${#lists.size(vacancies)}"></span></h2>
    <hr>

    <div class="row" th:if="${not #lists.isEmpty(vacancies)}">
        <div class="col-md-6 mb-4" th:each="v : ${vacancies}">
            <div class="card h-100 shadow-sm">
                <div class="card-header"><h5 class="text-primary" th:text="${v.title}"></h5></div>
                <div class="card-body">
                    <p><i class="fas fa-building"></i> <strong th:text="${v.department}"></strong></p>
                    <p th:if="${v.location != null}"><i class="fas fa-map-marker-alt text-danger"></i> <span th:text="${v.location}"></span></p>
                    <p>
                        <i class="fas fa-money-bill-wave text-success"></i>
                        <!-- Безопасный вывод целых чисел с разделением тысяч: например, 1 800 - 2 600 BYN -->
                        <span th:if="${v.salaryMin > 0 && v.salaryMax > 0}">
                            <strong th:text="${#numbers.formatInteger(v.salaryMin, 1, 'WHITESPACE')}"></strong> -
                            <strong th:text="${#numbers.formatInteger(v.salaryMax, 1, 'WHITESPACE')}"></strong> BYN
                        </span>
                        <span th:unless="${v.salaryMin > 0 || v.salaryMax > 0}">Не указана</span>
                    </p>
                    <p th:if="${v.requiredExperience > 0}"><i class="fas fa-briefcase text-info"></i> Опыт: от <span th:text="${v.requiredExperience}"></span> лет</p>
                    <p class="text-muted" th:if="${v.description != null}" th:text="${#strings.abbreviate(v.description, 150)}"></p>
                    <div class="d-flex justify-content-between">
                        <span class="badge" th:classappend="${v.vacancyType == 'EMPLOYEE' ? 'bg-primary' : 'bg-success'}" th:text="${v.vacancyType == 'EMPLOYEE' ? 'Офис' : 'Рабочий'}"></span>
                        <div>
                            <span class="badge bg-info me-2" th:if="${v.applicationsCount > 0}" th:text="${v.applicationsCount + ' откликов'}"></span>
                            <a th:href="@{/applications/apply/{id}(id=${v.id})}" class="btn btn-primary btn-sm"><i class="fas fa-paper-plane"></i> Откликнуться</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:unless="${not #lists.isEmpty(vacancies)}" class="text-center py-5">
        <h3>Нет открытых вакансий</h3>
        <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> На главную</a>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: script}"></script>
</body>
</html>
