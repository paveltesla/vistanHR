<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Назначение задачи - Вистан</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-tasks"></i> Назначение задачи</h4>
                </div>
                <div class="card-body">
                    <div class="mb-4">
                        <h5>Рабочий: <span th:text="${worker.fullName}">Имя рабочего</span></h5>
                        <p>Профессия: <span th:text="${worker.profession}">Профессия</span></p>
                        <p>Бригада: <span th:text="${worker.team}">Бригада</span></p>
                    </div>

                    <form th:action="@{/workers/assign-task/{id}(id=${worker.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Описание задачи *</label>
                            <textarea name="task" class="form-control" rows="4" required
                                      placeholder="Опишите задачу для рабочего..."></textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-check-circle"></i> Назначить задачу
                            </button>
                            <a href="/workers" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times"></i> Отмена
                            </a>
                        </div>
                    </form>

                    <div class="mt-4" th:if="${worker.assignedTasks != null && !#lists.isEmpty(worker.assignedTasks)}">
                        <h5>Текущие задачи:</h5>
                        <ul class="list-group">
                            <li class="list-group-item" th:each="task : ${worker.assignedTasks}" th:text="${task}">
                                Задача
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: script}"></script>
</body>
</html>
