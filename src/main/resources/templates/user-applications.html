<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Статус заявок - Вистан</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-building"></i> Вистан
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="fas fa-home"></i> Главная
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-chart-bar"></i> Статистика заявок</h4>
                </div>
                <div class="card-body text-center p-5">
                    <i class="fas fa-clock fa-5x text-warning mb-4"></i>
                    <h2>Заявки на рассмотрении</h2>
                    <h1 class="display-1 text-primary" th:text="${pendingCount}">0</h1>
                    <p class="text-muted mt-3">
                        Наши HR-менеджеры рассматривают ваши заявки.
                        Мы свяжемся с вами в ближайшее время.
                    </p>
                    <div class="mt-4">
                        <a href="/applications/add" class="btn btn-success btn-lg">
                            <i class="fas fa-plus-circle"></i> Подать новую заявку
                        </a>
                        <a href="/" class="btn btn-secondary btn-lg">
                            <i class="fas fa-home"></i> На главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: script}"></script>
</body>
</html>
