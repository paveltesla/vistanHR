<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Управление вакансиями — Вистан</title>
    <th:block th:replace="~{fragments :: header-css}"></th:block>
</head>
<body>

<nav th:replace="~{fragments :: navbar-admin}"></nav>

<main class="container mt-4">
    <div th:if="${success_mess}" class="alert alert-success shadow-sm"><span th:text="${success_mess}"></span></div>
    <div th:if="${error_mess}" class="alert alert-danger shadow-sm"><span th:text="${error_mess}"></span></div>

    <div class="card shadow">
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fas fa-briefcase"></i> Панель управления вакансиями</h4>
            <a th:href="@{/admin/vacancies/add}" class="btn btn-primary">Добавить вакансию</a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Отдел</th>
                        <th>Тип</th>
                        <th>Зарплата (BYN)</th>
                        <th>Отклики</th>
                        <th>Статус</th>
                        <th>Дата создания</th>
                        <th class="text-center">Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${vacancies}">
                        <td th:text="${v.id}"></td>
                        <td><strong th:text="${v.title}"></strong></td>
                        <td th:text="${v.department}"></td>
                        <td>
        <span class="badge" th:classappend="${v.vacancyType == 'EMPLOYEE' ? 'bg-primary' : 'bg-success'}"
              th:text="${v.vacancyType == 'EMPLOYEE' ? 'Офис' : 'Рабочий'}"></span>
                        </td>
                        <td>
                            <span th:if="${v.salaryMin > 0}" th:text="${#numbers.formatDecimal(v.salaryMin,0,'COMMA',2,'POINT')}"></span>
                            <span th:if="${v.salaryMin > 0 && v.salaryMax > 0}"> - </span>
                            <span th:if="${v.salaryMax > 0}" th:text="${#numbers.formatDecimal(v.salaryMax,0,'COMMA',2,'POINT')}"></span>
                            <span th:if="${v.salaryMin == null && v.salaryMax == null}">Не указана</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/vacancies/{id}/applications(id=${v.id})}" class="btn btn-info">Отклики</a>
                        </td>
                        <td>
                            <span th:if="${v.status == 'OPEN'}" class="badge bg-success">Открыта</span>
                            <span th:if="${v.status == 'CLOSED'}" class="badge bg-danger">Закрыта</span>
                        </td>
                        <td th:text="${#temporals.format(v.createdDate, 'dd.MM.yyyy')}"></td>
                        <td>
                            <div class="d-flex justify-content-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/admin/vacancies/edit/{id}(id=${v.id})}" class="btn btn-warning">Редактировать</a>
                                    <a th:href="@{/admin/vacancies/close/{id}(id=${v.id})}" class="btn btn-secondary">Закрыть</a>
                                    <a th:href="@{/admin/vacancies/delete/{id}(id=${v.id})}" class="btn btn-danger">Удалить</a>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(vacancies)}">
                        <td colspan="9" class="text-center text-muted py-4">В базе данных пока нет созданных вакансий.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: script}"></script>
</body>
</html>
