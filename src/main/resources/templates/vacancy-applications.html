<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Отклики на вакансию - Вистан</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mt-4">
    <div class="card mb-4">
        <div class="card-header bg-info text-white"><h4><i class="fas fa-briefcase"></i> <span th:text="${vacancy.title}"></span> <span class="badge bg-light text-dark" th:text="${vacancy.department}"></span></h4></div>
        <div class="card-body"><p><strong>Тип:</strong> <span th:text="${vacancy.vacancyType == 'EMPLOYEE' ? 'Офис' : 'Рабочий'}"></span> | <strong>Откликов:</strong> <span th:text="${#lists.size(applications)}"></span></p></div>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white"><h5><i class="fas fa-file-alt"></i> Отклики</h5></div>
        <div class="card-body">
            <div class="table-responsive" th:if="${not #lists.isEmpty(applications)}">
                <table class="table table-striped table-hover">
                    <thead class="table-dark"><tr><th>ID</th><th>ФИО</th><th>Email</th><th>Телефон</th><th>Опыт</th><th>Зарплата</th><th>Статус</th><th>Дата</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="a : ${applications}">
                        <td th:text="${a.id}"></td><td><strong th:text="${a.fullName}"></strong></td><td th:text="${a.email}"></td><td th:text="${a.phone}"></td>
                        <td th:text="${a.experience} + ' лет'"></td><td th:text="${a.expectedSalary} + ' BYN'"></td>
                        <td>
                            <span th:if="${a.applicationStatus == 'PENDING'}" class="badge bg-warning">Новый</span>
                            <span th:if="${a.applicationStatus == 'REVIEWED'}" class="badge bg-info">Просмотрен</span>
                            <span th:if="${a.applicationStatus == 'INTERVIEW'}" class="badge bg-primary">Собеседование</span>
                            <span th:if="${a.applicationStatus == 'ACCEPTED'}" class="badge bg-success">Принят</span>
                            <span th:if="${a.applicationStatus == 'REJECTED'}" class="badge bg-danger">Отклонен</span>
                        </td>
                        <td th:text="${#temporals.format(a.applicationDate, 'dd.MM.yyyy')}"></td>
                        <td><a th:href="@{/applications/review/{id}(id=${a.id})}" class="btn btn-sm btn-primary"><i class="fas fa-eye"></i></a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:unless="${not #lists.isEmpty(applications)}" class="text-center py-4"><h5>Нет откликов</h5></div>
        </div>
    </div>
    <div class="text-center mt-3"><a th:href="@{/admin/applications}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> К вакансиям</a></div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: script}"></script>
</body>
</html>
